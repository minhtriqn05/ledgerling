# After every new commit on main (a merged pull request): waits until Render runs that commit, checks that Vercel
# answers, then runs `npm run test:e2e:live` on the live site (client/e2e/live/site.live.js). That test makes one
# temporary account through the public API and deletes it at the end. No secrets are needed.
name: Live smoke

on:
  push:
    branches: [main]
  # Can also be started by hand from the Actions tab
  workflow_dispatch:

# Only the newest commit is checked
concurrency:
  group: live-smoke
  cancel-in-progress: true

env:
  LIVE_APP_URL: https://ledgerling-ten.vercel.app
  LIVE_API_URL: https://ledgerling-api.onrender.com/api

jobs:
  live:
    name: Live site
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, to compare the commit Render runs with this one
          fetch-depth: 0

      # GET /api/health answers { data: { version } }: the commit Render deployed (RENDER_GIT_COMMIT).
      # Render may skip a deploy when nothing in server/ changed; the commit it runs is then fine too.
      - name: Wait until Render runs this commit (15 minutes at most)
        run: |
          for attempt in $(seq 1 90); do
            version=$(curl -fsS --max-time 60 "$LIVE_API_URL/health" | jq -r '.data.version // empty' || true)
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "Render runs $GITHUB_SHA"
              exit 0
            fi
            if [ -n "$version" ] && git cat-file -e "$version^{commit}" 2>/dev/null && git diff --quiet "$version" "$GITHUB_SHA" -- server; then
              echo "Render runs $version, whose server/ is the same as in $GITHUB_SHA"
              exit 0
            fi
            echo "Attempt $attempt: Render runs ${version:-nothing yet}, waiting for $GITHUB_SHA"
            sleep 10
          done
          echo "Render still does not run $GITHUB_SHA after 15 minutes"
          exit 1

      - name: Vercel answers 200
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$LIVE_APP_URL/" || true)
            if [ "$status" = "200" ]; then
              echo "Vercel answered 200"
              exit 0
            fi
            echo "Attempt $attempt: Vercel answered $status"
            sleep 10
          done
          exit 1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run test:e2e:live
        working-directory: client
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-live
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7
