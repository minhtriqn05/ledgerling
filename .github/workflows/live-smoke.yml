# After every new commit on main (a merged pull request): waits until Render runs that commit and Vercel has deployed
# it, checks that Vercel answers, then runs `npm run test:e2e:live` on the live site (client/e2e/live/site.live.js).
# That test makes one temporary account through the public API and deletes it at the end. No secrets are needed: the
# Vercel deploy is read from the commit status that Vercel's GitHub app sets, with the token GitHub gives every run.
name: Live smoke

on:
  push:
    branches: [main]
  # Can also be started by hand from the Actions tab
  workflow_dispatch:

# Only the newest commit is checked
concurrency:
  group: live-smoke
  cancel-in-progress: true

env:
  LIVE_APP_URL: https://ledgerling-ten.vercel.app
  LIVE_API_URL: https://ledgerling-api.onrender.com/api

# Reads the code and the commit statuses, writes nothing
permissions:
  contents: read
  statuses: read

jobs:
  live:
    name: Live site
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, to compare the commit Render runs with this one
          fetch-depth: 0

      # GET /api/health answers { data: { version } }: the commit Render deployed (RENDER_GIT_COMMIT).
      # Render may skip a deploy when nothing in server/ changed; the commit it runs is then fine too.
      - name: Wait until Render runs this commit (15 minutes at most)
        run: |
          for attempt in $(seq 1 90); do
            version=$(curl -fsS --max-time 60 "$LIVE_API_URL/health" | jq -r '.data.version // empty' || true)
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "Render runs $GITHUB_SHA"
              exit 0
            fi
            if [ -n "$version" ] && git cat-file -e "$version^{commit}" 2>/dev/null && git diff --quiet "$version" "$GITHUB_SHA" -- server; then
              echo "Render runs $version, whose server/ is the same as in $GITHUB_SHA"
              exit 0
            fi
            echo "Attempt $attempt: Render runs ${version:-nothing yet}, waiting for $GITHUB_SHA"
            sleep 10
          done
          echo "Render still does not run $GITHUB_SHA after 15 minutes"
          exit 1

      # Vercel's GitHub app gives every commit of main a status named "Vercel": pending while it builds, then success
      # (or failure). Without this wait the test could run on the version before, while Vercel was still building.
      - name: Wait until Vercel has deployed this commit (15 minutes at most)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 90); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses" --jq '[.[] | select(.context == "Vercel")][0].state // empty' || true)
            case "$state" in
              success) echo "Vercel has deployed $GITHUB_SHA"; exit 0 ;;
              failure|error) echo "The Vercel deploy of $GITHUB_SHA failed ($state)"; exit 1 ;;
            esac
            echo "Attempt $attempt: Vercel status ${state:-not there yet}, waiting"
            sleep 10
          done
          echo "Vercel has still not deployed $GITHUB_SHA after 15 minutes"
          exit 1

      - name: Vercel answers 200
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$LIVE_APP_URL/" || true)
            if [ "$status" = "200" ]; then
              echo "Vercel answered 200"
              exit 0
            fi
            echo "Attempt $attempt: Vercel answered $status"
            sleep 10
          done
          exit 1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      # Same as in ci.yml: apt gives up on a silent Ubuntu mirror after 30 s, and the install is tried up to 3 times
      - name: Install the Playwright browser (chromium)
        working-directory: client
        timeout-minutes: 30
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-network > /dev/null
          for attempt in 1 2 3; do
            if timeout 8m npx playwright install --with-deps chromium; then exit 0; fi
            echo "Attempt $attempt of the browser install failed, trying again in 20 s"
            sleep 20
          done
          exit 1
      - run: npm run test:e2e:live
        working-directory: client
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-live
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7
