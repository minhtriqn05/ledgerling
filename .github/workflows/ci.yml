# Runs on every push and on every pull request into main.
# No secrets are needed: the tests use mongodb-memory-server (an empty MongoDB in memory), never Atlas.
# Ubuntu 24.04 by name, not ubuntu-latest: that label moves to Ubuntu 26 from October 2026, and the browsers of
# `playwright install --with-deps` and the MongoDB binary of mongodb-memory-server are known to work on 24.04.
name: CI

on:
  push:
  pull_request:
    branches: [main]

# A new push to the same branch stops the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server lint, tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Vitest + Supertest (NODE_ENV=test is set in vitest.config.js). Fails below the coverage thresholds of
      # vitest.config.js: 80% of the lines and of the branches.
      - run: npm run test:coverage

  client:
    name: Client lint, tests, coverage and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run i18n:check
      # Vitest + React Testing Library. Fails below the coverage thresholds of vitest.config.js: 60% of the lines,
      # 80% in src/utils and src/hooks.
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    name: End-to-end tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    # About 20 minutes of tests, plus room for the retries of the browser install below
    timeout-minutes: 60
    strategy:
      # One browser failing does not stop the other run
      fail-fast: false
      matrix:
        include:
          - name: Chrome, desktop and phone, every test
            browsers: chromium
            script: test:e2e:chromium
            report: playwright-report-chromium
          - name: Firefox and iPhone Safari, the @smoke tests
            browsers: firefox webkit
            script: test:e2e:smoke
            report: playwright-report-smoke
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm ci
      # Playwright starts the API from /server (in-memory database), so its packages are needed too
      - run: npm ci
        working-directory: server
      # The browsers and the Linux libraries they need (apt). An Ubuntu mirror that does not answer once kept apt
      # waiting until the job ran out of its 45 minutes, and a half-updated package list once ended in 404s.
      # apt now gives up on a silent mirror after 30 s and tries again; the whole install is tried up to 3 times,
      # 8 minutes each at most. It still fails the job when the third try fails.
      - name: Install the Playwright browsers (${{ matrix.browsers }})
        timeout-minutes: 30
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-network > /dev/null
          for attempt in 1 2 3; do
            if timeout 8m npx playwright install --with-deps ${{ matrix.browsers }}; then exit 0; fi
            echo "Attempt $attempt of the browser install failed, trying again in 20 s"
            sleep 20
          done
          exit 1
      # Builds the app, starts the API and vite preview, then runs the tests (client/playwright.config.js)
      - run: npm run ${{ matrix.script }}
      # The report is only kept when a test failed, to see why
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: ${{ matrix.report }}
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7
