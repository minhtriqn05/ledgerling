# Runs on every push and on every pull request into main.
# No secrets are needed: the tests use mongodb-memory-server (an empty MongoDB in memory), never Atlas.
name: CI

on:
  push:
  pull_request:
    branches: [main]

# A new push to the same branch stops the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Vitest + Supertest; NODE_ENV=test is set in vitest.config.js
      - run: npm test

  client:
    name: Client checks and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm ci
      # Playwright starts the API from /server (in-memory database), so its packages are needed too
      - run: npm ci
        working-directory: server
      # --if-present: there is no lint script yet
      - run: npm run lint --if-present
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # The report is only kept when a test failed, to see why
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7
