<!doctype html>
<!--
  The picture people see when the site is shared (Open Graph / Twitter card): 1200 x 630.
  scripts/capture-og.mjs opens this page in Playwright and saves public/og-image.png.
  Run it again (npm run og-image) after changing this file. The colors come from the design tokens.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ledgerling – social share image</title>
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: var(--font-sans);
        color: var(--color-text);
        background: var(--gradient-banner);
      }

      /* Two soft circles, like the hero of the landing page */
      body::before,
      body::after {
        content: '';
        position: absolute;
        border-radius: 999px;
        background: var(--color-surface);
        opacity: 0.5;
      }

      body::before {
        top: -180px;
        left: -120px;
        width: 420px;
        height: 420px;
      }

      body::after {
        right: 380px;
        bottom: -220px;
        width: 380px;
        height: 380px;
      }

      .copy {
        position: absolute;
        top: 56px;
        left: 80px;
        width: 600px;
        z-index: 1;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        color: var(--color-text);
      }

      h1 {
        margin: 36px 0 18px;
        font-size: 68px;
        line-height: 1.05;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .lead {
        margin: 0;
        max-width: 540px;
        font-size: 26px;
        line-height: 1.4;
        color: var(--color-text-secondary);
      }

      .pills {
        display: flex;
        gap: 12px;
        margin-top: 32px;
      }

      .pill {
        padding: 10px 20px;
        border-radius: 999px;
        background: var(--color-surface);
        color: var(--color-primary-text);
        font-size: 22px;
        font-weight: 600;
        box-shadow: var(--shadow-sm);
      }

      /* The hero card on the right: the big balance and a week of capsules */
      .hero {
        position: absolute;
        top: 96px;
        right: 80px;
        width: 420px;
        padding: 36px;
        border-radius: 32px;
        background: var(--gradient-hero);
        color: var(--color-hero-text);
        box-shadow: var(--shadow-lg);
        z-index: 1;
      }

      .hero small {
        display: block;
        font-size: 22px;
        color: var(--color-hero-text-soft);
      }

      .hero strong {
        display: block;
        margin: 8px 0 28px;
        font-size: 46px;
        letter-spacing: -0.03em;
        white-space: nowrap;
      }

      .bars {
        display: flex;
        align-items: flex-end;
        gap: 14px;
        height: 150px;
      }

      .bars span {
        flex: 1;
        border-radius: 999px;
        background: var(--color-hero-decor);
      }

      .bars span.peak {
        background: var(--color-surface);
      }

      .chip {
        position: absolute;
        right: 56px;
        bottom: 60px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 18px 26px 18px 18px;
        border-radius: 24px;
        background: var(--color-surface);
        box-shadow: var(--shadow-md);
        z-index: 2;
      }

      .chip .tile {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: var(--color-income-soft);
        color: var(--color-income-text);
      }

      .chip small {
        display: block;
        font-size: 18px;
        color: var(--color-text-muted);
      }

      .chip b {
        font-size: 28px;
        color: var(--color-income-text);
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand">
        <!-- The logo mark and the word, as in components/Logo/Logo.jsx -->
        <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
          <defs>
            <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
              <stop offset="0" style="stop-color: var(--color-hero-from)" />
              <stop offset="1" style="stop-color: var(--color-hero-to)" />
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="16" fill="url(#g)" />
          <path d="M21 13V45H49" fill="none" style="stroke: var(--color-on-primary)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M34 16H49M34 25H49M34 34H49" style="stroke: var(--color-logo-accent)" stroke-width="5" stroke-linecap="round" />
        </svg>
        <svg viewBox="0 0 120.1 32" height="52" width="195" aria-hidden="true">
          <path
            d="M1.5 3V22H10M14.2 16H26.2A6 6 0 1 0 24.5 20.2M29.4 16a6 6 0 1 0 12 0a6 6 0 1 0 -12 0M41.4 3V22M44.6 16a6 6 0 1 0 12 0a6 6 0 1 0 -12 0M56.6 10V23.5A6 6 0 0 1 46 27M59.8 16H71.8A6 6 0 1 0 70.1 20.2M75 10V22M75 15.5C75 12 77.6 10 81.2 10.2M83.8 3V22M88.6 10V22M88.6 4.6v.01M93.4 10V22M93.4 15.5A5 5 0 0 1 103.4 15.5V22M106.6 16a6 6 0 1 0 12 0a6 6 0 1 0 -12 0M118.6 10V23.5A6 6 0 0 1 108 27"
            fill="none"
            stroke="currentColor"
            stroke-width="2.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <h1>Know where your money goes.</h1>
      <p class="lead">A calm, simple personal expense tracker with budgets, savings goals and reports.</p>
      <div class="pills">
        <span class="pill">Budgets</span>
        <span class="pill">Goals</span>
        <span class="pill">Reports</span>
      </div>
    </div>

    <div class="hero">
      <small>Balance</small>
      <strong>12,450,000 ₫</strong>
      <div class="bars" aria-hidden="true">
        <span style="height: 30%"></span>
        <span style="height: 62%"></span>
        <span style="height: 22%"></span>
        <span style="height: 44%"></span>
        <span class="peak" style="height: 100%"></span>
        <span style="height: 54%"></span>
        <span style="height: 34%"></span>
      </div>
    </div>

    <div class="chip">
      <span class="tile">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 21v-9" />
          <path d="M12 12c0-4 3-7 8-7 0 4-3 7-8 7z" />
          <path d="M12 15c0-3-2.5-6-7-6 0 3.5 2.5 6 7 6z" />
        </svg>
      </span>
      <span>
        <small>Saved this month</small>
        <b>+7,900,000 ₫</b>
      </span>
    </div>
  </body>
</html>
