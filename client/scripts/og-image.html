<!doctype html>
<!--
  The picture people see when the site is shared (Open Graph / Twitter card): 1200 x 630.
  scripts/capture-og.mjs opens this page in Playwright and saves public/og-image.png.
  Run it again (npm run og-image) after changing this file. The colors come from the design tokens.
-->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Ledgerling – social share image</title>
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&family=Newsreader:opsz,wght@6..72,300..500&display=swap" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: var(--font-sans);
        color: var(--color-hero-text);
        background: var(--color-hero-base);
      }

      /* The aurora of the hero */
      .light {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
      }

      .emerald {
        top: -240px;
        left: -60px;
        width: 620px;
        height: 480px;
        background: var(--aurora-emerald);
        opacity: 0.5;
      }

      .ice {
        top: -260px;
        right: -60px;
        width: 640px;
        height: 500px;
        background: var(--aurora-ice);
        opacity: 0.46;
      }

      .warm {
        right: 240px;
        bottom: -240px;
        width: 480px;
        height: 340px;
        background: var(--aurora-warm);
        opacity: 0.14;
      }

      .copy {
        position: absolute;
        top: 64px;
        left: 80px;
        width: 700px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      h1 {
        margin: 96px 0 0;
        font-family: var(--font-display);
        font-size: 92px;
        font-weight: 400;
        line-height: 1.02;
        letter-spacing: -0.028em;
      }

      p {
        margin: 28px 0 0;
        color: var(--color-hero-text-soft);
        font-size: 26px;
        line-height: 1.4;
      }

      /* A wallet card, on the right */
      .card {
        position: absolute;
        top: 196px;
        right: 72px;
        width: 340px;
        padding: 30px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 28px;
        background: linear-gradient(160deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.04) 100%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 50px 90px -40px rgba(0, 0, 0, 1);
      }

      .card small {
        color: var(--color-hero-text-soft);
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .card strong {
        display: block;
        margin-top: 8px;
        font-size: 44px;
        font-weight: 300;
        letter-spacing: -0.03em;
      }

      .bars {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 130px;
        margin-top: 26px;
      }

      .bars i {
        flex: 1;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.16);
      }

      .bars i:last-child {
        background: linear-gradient(180deg, #8ff0cd 0%, #7cc4f5 100%);
      }
    </style>
  </head>
  <body>
    <span class="light emerald"></span>
    <span class="light ice"></span>
    <span class="light warm"></span>
    <div class="copy">
      <div class="brand">
        <img src="../public/favicon.svg" width="52" height="52" alt="" />
        Ledgerling
      </div>
      <h1>Know where your money goes.</h1>
      <p>Income, expenses, budgets, wallets and goals, in one calm place.</p>
    </div>
    <div class="card">
      <small>Balance</small>
      <strong>11,559,000 ₫</strong>
      <div class="bars">
        <i style="height: 42%"></i>
        <i style="height: 66%"></i>
        <i style="height: 54%"></i>
        <i style="height: 86%"></i>
        <i style="height: 72%"></i>
        <i style="height: 100%"></i>
      </div>
    </div>
  </body>
</html>
